# Documentation site (MkDocs Material). Pull requests only build it with --strict,
# so broken links and missing pages fail the check; pushes to main also publish it
# to GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - docs-agent-mcp/charts/gateway-guardrails/README.md
      - docs-agent-mcp/pipelines/README.md
      - .github/workflows/docs.yaml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - docs-agent-mcp/charts/gateway-guardrails/README.md
      - docs-agent-mcp/pipelines/README.md
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: python -m pip install "mkdocs-material==9.6.*"

      - name: Build
        run: mkdocs build --strict

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
